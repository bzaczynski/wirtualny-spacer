  const tour = { on: false, step: 0, view: '', timer: 0 };             // the guided tour
  const primer = { seen: {}, kind: '', text: '' };                     // instructions shown as a notice on a phone
  let spinUntil = 0;       // the model turns slowly on its own until then, or until touched
  let lastFrame = 0;
  let lastDraw = 0;        // when the picture was last drawn
  let sunSpans = null;     // sun on the windows on 21 June and 21 December, once the view outside is known
  const pickable = [];     // meshes a double click can land on
  const caps = [];         // the fill of each cut solid, with the heights its solid spans
  const doors = [];        // doors that open for a visitor who walks up to them
  const lamps = [];
  const labels = [];

  // --- model ---------------------------------------------------------------------------

  function decode(base64) {
    const text = atob(base64);
    const bytes = new Uint8Array(text.length);
    for (let i = 0; i < text.length; i++) bytes[i] = text.charCodeAt(i);
    return bytes.buffer;
  }

  function layerOf(object) {
    for (let o = object; o; o = o.parent) {
      if (o.userData && o.userData.layer) return o.userData.layer;
    }
    return '';
  }

  function shown(object) {
    for (let o = object; o; o = o.parent) if (!o.visible) return false;
    return true;
  }

  function setup(model) {
    info = model.userData;
    const lo = new THREE.Vector3().fromArray(info.bounds.min);
    const hi = new THREE.Vector3().fromArray(info.bounds.max);
    center = new THREE.Vector3((lo.x + hi.x) / 2, info.height / 2, (lo.z + hi.z) / 2);

    const anisotropy = renderer.capabilities.getMaxAnisotropy();
    const edge = new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.2 });
    const edgeCut = edge.clone();
    edgeCut.clippingPlanes = [cut];
    const cutMaterials = new Map();
    const capMaterials = new Map();
    let capColor = srgb(0x7a756c);

    model.traverse((o) => {
      if (o.isMesh && o.material.userData.id === 'wall_top') capColor = o.material.color;
    });

    const meshes = [];
    model.updateMatrixWorld(true);
    model.traverse((o) => { if (o.isMesh) meshes.push(o); });
    meshes.forEach((mesh) => {
      const building = layerOf(mesh) === 'building';
      let material = mesh.material;
      const id = material.userData.id || '';
      const frosted = !!material.userData.frosted;     // glass that lets light through but no view
      const clear = material.transparent && !frosted;
      const sticker = !!material.userData.sticker;     // a photo stuck onto a surface
      const skin = !!material.userData.skin;           // a thin layer on a wall: tiles, a socket
      if (material.map) material.map.anisotropy = anisotropy;
      material.polygonOffset = true;
      material.polygonOffsetFactor = 1;
      material.polygonOffsetUnits = 1;
      if (clear) material.depthWrite = false;
      if (frosted) material.depthWrite = true;         // so that it hides the outlines behind it

      if (building) {
        // Building parts get their own copy of the material, cut by the wall-height plane.
        if (!cutMaterials.has(material)) {
          const copy = material.clone();
          copy.clippingPlanes = [cut];
          copy.clipShadows = true;
          cutMaterials.set(material, copy);
        }
        material = mesh.material = cutMaterials.get(material);
      }
      mesh.castShadow = !clear && !sticker && !frosted;
      mesh.receiveShadow = !clear;
      mesh.userData.floor = id.indexOf('floor_') === 0;
      if (!clear) pickable.push(mesh);
      if (clear || sticker) return;

      const lines = new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry, 28), building ? edgeCut : edge);
      lines.raycast = () => {};
      mesh.add(lines);

      if (building && !mesh.userData.floor && !skin) {
        // Where the plane cuts a solid we would look inside it. Drawing the inside in one
        // flat colour makes the cut read as a filled section. A thin layer gets none: seen
        // at a slant the fill, pulled towards the camera, would show through its face.
        const wall = id.indexOf('wall_') === 0;
        const key = wall ? 'wall' : id;
        if (!capMaterials.has(key)) {
          const color = wall ? capColor : (material.map ? srgb(0xbdbdb8) : material.color.clone().multiplyScalar(0.62));
          // Pulled a little towards the camera so it also hides the outlines inside the solid.
          capMaterials.set(key, new THREE.MeshBasicMaterial({
            color, side: THREE.BackSide, clippingPlanes: [cut],
            polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -2,
          }));
        }
        const cap = new THREE.Mesh(mesh.geometry, capMaterials.get(key));
        cap.raycast = () => {};
        mesh.add(cap);
        const span = new THREE.Box3().setFromBufferAttribute(mesh.geometry.attributes.position).applyMatrix4(mesh.matrixWorld);
        caps.push({ cap, low: span.min.y, high: span.max.y });
      }
    });

    // A door that opens turns about its hinges: its leaf hangs on a pivot standing there.
    (info.doors || []).forEach((d) => {
      let leaf = null;
      model.traverse((o) => { if (o.userData.name === d.name) leaf = o; });
      if (!leaf) return;
      const pivot = new THREE.Group();
      pivot.position.fromArray(d.hinge);
      leaf.parent.add(pivot);
      pivot.attach(leaf);
      doors.push({ pivot, swing: d.swing, at: new THREE.Vector3().fromArray(d.at), into: d.into, open: 0, wanted: 0 });
    });

    model.traverse((o) => { if (layers[o.userData.layer]) layers[o.userData.layer].push(o); });
    scene.add(model);

    // Ceiling: one-sided, so it shows from inside the rooms but never from above.
    ceiling = new THREE.Mesh(
      new THREE.PlaneGeometry(hi.x - lo.x, hi.z - lo.z),
      new THREE.MeshBasicMaterial({ color: srgb(0xe9e6de), clippingPlanes: [cut] }));
    ceiling.rotation.x = Math.PI / 2;
    ceiling.position.set(center.x, info.height - 0.002, center.z);
    ceiling.raycast = () => {};
    scene.add(ceiling);

    // Soft shadow of the whole flat on the "ground".
    ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.ShadowMaterial({ opacity: 0.16 }));
    ground.rotation.x = -Math.PI / 2;
    ground.position.set(center.x, lo.y - 0.003, center.z);
    ground.receiveShadow = true;
    ground.raycast = () => {};
    scene.add(ground);

    cutList = Array.from(cutMaterials.values());
    site = info.site;
    try {
      clock = new Intl.DateTimeFormat('en-GB', { timeZone: site.zone, hourCycle: 'h23',
        year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric' });
    } catch (error) {
      clock = null;        // very old browser: fall back to winter time
    }

    // The sun is far enough for the picture of the buildings outside to lie between it
    // and the flat; the shadow map itself only spans the flat.
    direction(118, 57, studio);       // light used when the real sun is switched off
    sun.target.position.copy(center);
    const reach = lo.distanceTo(hi) / 2 + 1;
    const size = renderer.capabilities.maxTextureSize >= 8192 && window.innerWidth > 700 ? 4096 : 2048;
    sun.shadow.mapSize.set(size, size);
    sun.shadow.camera.left = sun.shadow.camera.bottom = -reach;
    sun.shadow.camera.right = sun.shadow.camera.top = reach;
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = SUN_FAR + reach + 2;
    sun.shadow.camera.updateProjectionMatrix();
    sun.shadow.bias = -0.0003;
    sun.shadow.normalBias = 0.02;

    // What the flat sits in: the floors above and the rest of this storey. Never drawn,
    // but with the real sun it keeps the light out everywhere except through the windows.
    const hidden = new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: false });
    const mass = (x0, x1, y0, y1, z0, z1) => {
      const box = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), hidden);
      box.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
      box.raycast = () => {};
      shell.push(box);
      scene.add(box);
    };
    const far = 14, top = info.height;
    mass(lo.x, hi.x + far, top, top + 20, lo.z - far, hi.z + far);    // floors above
    mass(lo.x, hi.x + far, lo.y, top, lo.z - far, lo.z);              // flats next door, one side
    mass(lo.x, hi.x + far, lo.y, top, hi.z, hi.z + far);              // ... and the other
    mass(hi.x, hi.x + far, lo.y, top, lo.z, hi.z);                    // staircase side

    // The sun's disc with its glow, seen through the windows.
    const glow = document.createElement('canvas');
    glow.width = glow.height = 128;
    const paint = glow.getContext('2d');
    const halo = paint.createRadialGradient(64, 64, 0, 64, 64, 64);
    halo.addColorStop(0, 'rgba(255,255,255,1)');
    halo.addColorStop(0.07, 'rgba(255,252,235,1)');
    halo.addColorStop(0.16, 'rgba(255,236,170,0.5)');
    halo.addColorStop(1, 'rgba(255,220,140,0)');
    paint.fillStyle = halo;
    paint.fillRect(0, 0, 128, 128);
    disc = new THREE.Sprite(new THREE.SpriteMaterial({
      map: new THREE.CanvasTexture(glow), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true,
    }));
    disc.scale.setScalar(26);
    disc.visible = false;
    disc.raycast = () => {};
    scene.add(disc);

    // A lamp in every room, used only for the views from inside.
    info.rooms.forEach((room) => {
      const lamp = new THREE.PointLight(srgb(0xfff1dc), 0, 7, 1.6);
      lamp.position.set(room.at[0], info.height - 0.35, room.at[2]);
      lamps.push(lamp);
      scene.add(lamp);
    });

    buildLabels();
    buildDims();
    buildPins();
    buildButtons();
    retitle();
    $('loading').hidden = true;
    // The picture of the view outside is a pair of images. Inside this page they are
    // there already; as files of their own they may still be on their way, and the model
    // is shown without waiting for them.
    const images = [$('view-photo'), $('view-sky')];
    const loaded = (image) => new Promise((resolve) => {
      if (image.complete) resolve();
      else image.onload = image.onerror = () => resolve();
    });
    const addBackdrop = () => {
      try {
        if (images[0].naturalWidth && images[1].naturalWidth && info.view) buildBackdrop(images[0], images[1]);
      } catch (error) {
        backdrop = null;       // no picture outside: the sun then always has a clear sky
      }
    };
    if (images[0].complete && images[1].complete) {
      addBackdrop();
      start();
      summarizeSun();
    } else {
      start();
      Promise.all(images.map(loaded)).then(() => {
        addBackdrop();
        if (backdrop) surroundingsArrived();
        summarizeSun();
      });
    }
  }

  // --- sun --------------------------------------------------------------------------------

  const RAD = Math.PI / 180;
  const SUN_FAR = 60;
  const hhmm = (minutes) => Math.floor(minutes / 60) + ':' + String(Math.floor(minutes) % 60).padStart(2, '0');

  // Azimuth (degrees clockwise from north) and elevation of the sun for a moment and a
  // place, after NOAA's solar calculator: good to a few hundredths of a degree.
  function sunAt(date, lat, lon) {
    const t = (date.getTime() / 86400000 + 2440587.5 - 2451545) / 36525;
    const l0 = (280.46646 + t * (36000.76983 + 0.0003032 * t)) % 360;
    const m = (357.52911 + t * (35999.05029 - 0.0001537 * t)) * RAD;
    const e = 0.016708634 - t * (0.000042037 + 0.0000001267 * t);
    const c = Math.sin(m) * (1.914602 - t * (0.004817 + 0.000014 * t)) +
              Math.sin(2 * m) * (0.019993 - 0.000101 * t) + Math.sin(3 * m) * 0.000289;
    const omega = (125.04 - 1934.136 * t) * RAD;
    const lambda = (l0 + c - 0.00569 - 0.00478 * Math.sin(omega)) * RAD;
    const eps = (23 + (26 + (21.448 - t * (46.815 + t * (0.00059 - t * 0.001813))) / 60) / 60 +
                 0.00256 * Math.cos(omega)) * RAD;
    const decl = Math.asin(Math.sin(eps) * Math.sin(lambda));
    const y = Math.pow(Math.tan(eps / 2), 2);
    const eot = 4 / RAD * (y * Math.sin(2 * l0 * RAD) - 2 * e * Math.sin(m) +
                           4 * e * y * Math.sin(m) * Math.cos(2 * l0 * RAD) -
                           0.5 * y * y * Math.sin(4 * l0 * RAD) - 1.25 * e * e * Math.sin(2 * m));
    const utc = date.getUTCHours() * 60 + date.getUTCMinutes() + date.getUTCSeconds() / 60;
    const solar = (((utc + eot + 4 * lon) % 1440) + 1440) % 1440;       // true solar time, minutes
    const ha = (solar / 4 - 180) * RAD, la = lat * RAD;
    const cosZenith = Math.sin(la) * Math.sin(decl) + Math.cos(la) * Math.cos(decl) * Math.cos(ha);
    let el = 90 - Math.acos(clamp(cosZenith, -1, 1)) / RAD;
    const az = (Math.atan2(Math.sin(ha), Math.cos(ha) * Math.sin(la) - Math.tan(decl) * Math.cos(la)) / RAD + 180) % 360;
    // The air bends the light, which lifts the sun a little near the horizon.
    const tan = Math.tan(el * RAD);
    if (el > 5 && el <= 85) el += (58.1 / tan - 0.07 / Math.pow(tan, 3) + 0.000086 / Math.pow(tan, 5)) / 3600;
    else if (el > -0.575 && el <= 5) el += (1735 + el * (-518.2 + el * (103.4 + el * (-12.79 + el * 0.711)))) / 3600;
    else if (el <= -0.575) el += -20.772 / tan / 3600;
    return { az, el };
  }

  // Date and minutes since midnight on the flat's clocks at a moment in time.
  function wallClock(date) {
    if (!clock) {
      const d = new Date(date.getTime() + 3600000);
      return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate(), minutes: d.getUTCHours() * 60 + d.getUTCMinutes() };
    }
    const p = {};
    clock.formatToParts(date).forEach((part) => { p[part.type] = parseInt(part.value, 10); });
    return { y: p.year, m: p.month, d: p.day, minutes: p.hour * 60 + p.minute };
  }

  // The moment when the flat's clocks show the given date and minutes since midnight.
  function moment(y, m, d, minutes) {
    const wanted = Date.UTC(y, m - 1, d, 0, minutes);
    let date = new Date(wanted);
    for (let i = 0; i < 2; i++) {
      const w = wallClock(date);
      date = new Date(date.getTime() + wanted - Date.UTC(w.y, w.m - 1, w.d, 0, w.minutes));
    }
    return date;
  }

  // Unit vector towards a point of the sky.
  function direction(az, el, out) {
    const a = az * RAD, e = el * RAD, n = info.north;
    return out.set((Math.cos(a) * n[0] - Math.sin(a) * n[1]) * Math.cos(e), Math.sin(e),
                   (Math.cos(a) * n[1] + Math.sin(a) * n[0]) * Math.cos(e));
  }

  // How open the sky is in a direction, 0..1, going by the picture taken from the window.
  function openSky(az, el) {
    const v = info.view, t = Math.tan(el * RAD);
    if (!sky || az < v.az[0] || az > v.az[1] || t > v.tan[1]) return 1;
    if (t < v.tan[0]) return 0;
    const x = Math.min(sky.width - 1, Math.floor((az - v.az[0]) / (v.az[1] - v.az[0]) * sky.width));
    const y = Math.min(sky.height - 1, Math.floor((v.tan[1] - t) / (v.tan[1] - v.tan[0]) * sky.height));
    return 1 - sky.data[(y * sky.width + x) * 4 + 3] / 255;
  }

  // The same for the sun's whole disc (half a degree across).
  function openSun(s) {
    let sum = 0;
    for (let i = 0; i < 5; i++) sum += openSky(s.az + [0, 0.3, -0.3, 0, 0][i], s.el + [0, 0, 0, 0.25, -0.25][i]);
    return sum / 5;
  }

  // Does the sun shine onto the window wall: up, in front of the wall, not hidden?
  const facing = (s) => Math.cos((s.az - site.facade) * RAD);
  const reaches = (s) => s.el > 0 && facing(s) > 0.04 && openSun(s) > 0.5;

  // Sunrise, sunset and the spans of sun on the windows for one date, in minutes of that day.
  function daySummary(y, m, d) {
    const out = { rise: null, set: null, spans: [] };
    let before = null, start = null;
    for (let minutes = 0; minutes <= 1440; minutes += 2) {
      const s = sunAt(moment(y, m, d, minutes), site.lat, site.lon);
      if (before !== null && before <= -0.833 && s.el > -0.833) out.rise = minutes;
      if (before !== null && before > -0.833 && s.el <= -0.833) out.set = minutes;
      before = s.el;
      const lit = reaches(s);
      if (lit && start === null) start = minutes;
      if (!lit && start !== null) { out.spans.push([start, minutes]); start = null; }
    }
    out.spans = out.spans.filter((span) => span[1] - span[0] >= 6);
    return out;
  }

  // The view outside: the picture taken from the window, hung on a wall that curves
  // around the window side of the flat at about the distance of the block opposite.
  // Its sky is transparent, so what remains both shows through the windows and shades.
  function buildBackdrop(photo, mask) {
    const v = info.view;
    const picture = document.createElement('canvas');
    picture.width = photo.naturalWidth;
    picture.height = photo.naturalHeight;
    const paint = picture.getContext('2d');
    paint.drawImage(photo, 0, 0);
    paint.globalCompositeOperation = 'destination-in';
    paint.drawImage(mask, 0, 0, picture.width, picture.height);
    const texture = new THREE.CanvasTexture(picture);
    texture.encoding = THREE.sRGBEncoding;
    texture.generateMipmaps = false;
    texture.minFilter = THREE.LinearFilter;

    const pixels = document.createElement('canvas');
    pixels.width = mask.naturalWidth;
    pixels.height = mask.naturalHeight;
    pixels.getContext('2d').drawImage(mask, 0, 0);
    sky = pixels.getContext('2d').getImageData(0, 0, pixels.width, pixels.height);

    const steps = 72, positions = [], uvs = [], index = [];
    const origin = new THREE.Vector3().fromArray(v.at), d = new THREE.Vector3();
    for (let i = 0; i <= steps; i++) {
      direction(v.az[0] + (v.az[1] - v.az[0]) * i / steps, 0, d);
      for (let k = 0; k < 2; k++) {
        positions.push(origin.x + d.x * v.radius, origin.y + v.tan[k] * v.radius, origin.z + d.z * v.radius);
        uvs.push(i / steps, k);
      }
      if (i) index.push(2 * i - 2, 2 * i - 1, 2 * i + 1, 2 * i - 2, 2 * i + 1, 2 * i);
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geometry.setIndex(index);
    backdrop = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({ map: texture, alphaTest: 0.5, side: THREE.DoubleSide }));
    backdrop.customDepthMaterial = new THREE.MeshDepthMaterial({
      depthPacking: THREE.RGBADepthPacking, map: texture, alphaTest: 0.5, side: THREE.DoubleSide,
    });
    backdrop.frustumCulled = false;
    backdrop.raycast = () => {};
    scene.add(backdrop);

    // The ground far below the windows, under the picture's lower edge.
    outside = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshBasicMaterial({ color: srgb(0x5c5f4a) }));
    outside.rotation.x = -Math.PI / 2;
    outside.position.set(origin.x, origin.y + v.tan[0] * v.radius, origin.z);
    outside.raycast = () => {};
    scene.add(outside);
  }

  const sunLow = srgb(0xffb163), sunHigh = srgb(0xfff4e2);
  const skyDay = srgb(0xffffff), skyNight = srgb(0x55607a);
  const groundDay = srgb(0xd9d3c7), groundNight = srgb(0x3d3f47);
  const backNight = srgb(0x0b1220), backDusk = srgb(0xe2a37a), backDay = srgb(0xa9cbee);

  // Set every light for the current mode and, with the real sun on, for the date and hour.
  function relight() {
    if (!info) return;
    const look = state.mode === 'look';
    const real = $('sun-on').checked;
    let day = 1, power = look ? 0.75 : 0.6, lamp = look ? 0.42 : 0;
    hemi.intensity = look ? 0.5 : 0.6;
    ambient.intensity = look ? 0.3 : 0.16;
    if (real) {
      const s = sunAt(moment(when.y, when.m, when.d, when.minutes), site.lat, site.lon);
      sunNow.az = s.az;
      sunNow.el = s.el;
      sunNow.open = s.el > 0 ? openSun(s) : 0;
      direction(s.az, Math.max(s.el, 0.5), toSun);
      day = clamp((s.el + 6) / 12, 0, 1);
      day = day * day * (3 - 2 * day);                                   // 0 at night, 1 by day
      // Weaker and warmer when low: the light has more air to cross.
      power = 0.95 * clamp((s.el + 0.6) / 4, 0, 1) * Math.pow(Math.sin(Math.max(s.el, 0) * RAD), 0.3);
      sun.color.copy(sunLow).lerp(sunHigh, clamp(s.el / 25, 0, 1));
      // Sunshine that gets in through the windows also brightens the rooms as a whole.
      const entering = power * sunNow.open * Math.max(0, facing(s)) * Math.cos(Math.max(s.el, 0) * RAD);
      hemi.intensity = 0.13 + 0.5 * day + 0.16 * entering;
      ambient.intensity = 0.07 + 0.2 * day;
      lamp = 0.95 * (1 - day);
    } else {
      toSun.copy(studio);
      sun.color.copy(sunHigh);
    }
    hemi.color.copy(skyNight).lerp(skyDay, day);
    hemi.groundColor.copy(groundNight).lerp(groundDay, day);
    sun.intensity = power;
    sun.position.copy(center).addScaledVector(toSun, SUN_FAR);
    // A lamp that is off is left out altogether: every surface is then drawn without
    // the code for five lamps, which is a good part of a frame on a weak graphics card.
    lamps.forEach((light) => { light.intensity = lamp; light.visible = lamp > 0; });

    // Real sun: the building around and the buildings opposite shade the flat, and walls
    // cast their full shadow even where they are shown cut. Otherwise: an open roof.
    shell.forEach((box) => { box.castShadow = real; });
    cutList.forEach((material) => { material.clipShadows = !real; });
    ceiling.castShadow = !real && look;
    ground.visible = !real;
    if (backdrop) {
      backdrop.castShadow = real;
      backdrop.material.colorWrite = backdrop.material.depthWrite = real && look;   // from above it only shades
      backdrop.material.color.setScalar(0.1 + 0.9 * day);
      outside.visible = real && look;
      outside.material.color.copy(srgb(0x5c5f4a)).multiplyScalar(0.1 + 0.9 * day);
    }
    scene.background = real && look
      ? (day < 0.5 ? backNight.clone().lerp(backDusk, day * 2) : backDusk.clone().lerp(backDay, day * 2 - 1))
      : null;
    disc.visible = real && look && sunNow.el > -0.8;
    disc.material.color.copy(sun.color);
    describeSun(real);
    invalidate();
  }

  function describeSun(real) {
    $('sun-time').textContent = t('hour') + hhmm(when.minutes);
    ['sun-date', 'sun-minutes', 'sun-now', 'sun-play'].forEach((id) => { $(id).disabled = !real; });
    drawDay(real);
    if (!real) {
      $('sun-note').textContent = t('studio');
      return;
    }
    const s = sunNow;
    let text = t('below');
    if (s.el > 0) {
      text = t('above', Math.round(s.el), t('winds')[Math.round(s.az / 45) % 8]);
      if (facing(s) <= 0.04) text += t('behind');
      else text += t(s.open > 0.5 ? 'shines' : 'hidden');
    }
    if (today) {
      const spans = today.spans.map((span) => hhmm(span[0]) + '–' + hhmm(span[1])).join(', ');
      text += spans ? t('spans', spans) : t('never');
    }
    $('sun-note').textContent = text;
  }

  // The strip under the hour slider: night, daylight and the hours of sun on the windows,
  // with sunrise and sunset marked. Redrawn only when the date or the language changes.
  let dayDrawn = '';
  function drawDay(real) {
    const key = real && today ? [when.y, when.m, when.d, lang].join('-') : 'off';
    if (key === dayDrawn) return;
    dayDrawn = key;
    $('sun-day').style.visibility = key === 'off' ? 'hidden' : 'visible';
    if (key === 'off') return;
    const last = parseInt($('sun-minutes').max, 10);
    const at = (minutes) => (clamp(minutes / last, 0, 1) * 100).toFixed(2) + '%';
    const rise = today.rise === null ? 0 : today.rise, set = today.set === null ? 1440 : today.set;
    const colour = (minutes) => (today.spans.some((span) => minutes >= span[0] && minutes < span[1]) ? '#f2a516'
      : minutes >= rise && minutes < set ? 'rgba(150, 195, 240, .9)' : 'rgba(70, 80, 105, .6)');
    const stops = [];
    let current = colour(0);
    stops.push(current + ' 0%');
    for (let minutes = 2; minutes <= last; minutes += 2) {
      const next = colour(minutes);
      if (next !== current) {
        stops.push(current + ' ' + at(minutes), next + ' ' + at(minutes));
        current = next;
      }
    }
    stops.push(current + ' 100%');
    $('sun-strip').style.background = 'linear-gradient(to right, ' + stops.join(', ') + ')';
    [['rise', today.rise], ['set', today.set]].forEach((mark) => {
      const label = $('sun-' + mark[0]), tick = $('sun-' + mark[0] + '-tick');
      label.style.display = tick.style.display = mark[1] === null ? 'none' : '';
      if (mark[1] === null) return;
      tick.style.left = at(mark[1]);
      // The caption stays inside the strip even when the tick is near an end.
      label.style.left = (clamp(mark[1] / last, 0.13, 0.87) * 100).toFixed(2) + '%';
      label.textContent = t(mark[0]) + hhmm(mark[1]);
    });
  }

  // Show another date or hour (on the flat's clocks).
  function setWhen(y, m, d, minutes) {
    if (!today || y !== when.y || m !== when.m || d !== when.d) today = daySummary(y, m, d);
    when.y = y; when.m = m; when.d = d;
    when.minutes = clamp(minutes, 0, 1439);
    $('sun-date').value = y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    $('sun-minutes').value = Math.round(when.minutes / 5) * 5;
    document.querySelectorAll('#seasons button').forEach((button) => {
      button.setAttribute('aria-pressed', String(+button.dataset.month === m && +button.dataset.day === d));
    });
    relight();
  }

  function play(on) {
    playing = on ? performance.now() : 0;
    $('sun-play').setAttribute('aria-pressed', String(on));
    $('sun-play').textContent = t(on ? 'stop' : 'play');
    if (on && when.minutes > 1380) setWhen(when.y, when.m, when.d, 240);
    invalidate();
  }

  $('sun-on').addEventListener('input', () => { play(false); relight(); });
  $('sun-date').addEventListener('input', () => {
    const parts = $('sun-date').value.split('-').map((part) => parseInt(part, 10));
    if (parts.length === 3 && parts.every((part) => part > 0)) setWhen(parts[0], parts[1], parts[2], when.minutes);
  });
  $('sun-minutes').addEventListener('input', () => { ownHour = false; play(false); setWhen(when.y, when.m, when.d, parseInt($('sun-minutes').value, 10)); });
  $('sun-now').addEventListener('click', () => {
    const now = wallClock(new Date());
    ownHour = false;
    play(false);
    setWhen(now.y, now.m, now.d, now.minutes);
  });
  $('sun-play').addEventListener('click', () => { ownHour = false; play(!playing); });
  $('sun').addEventListener('toggle', () => { clearOfPanel(); invalidate(); });

  // The longest, the middle and the shortest day of this year, at the sunniest hour.
  document.querySelectorAll('#seasons button').forEach((button) => button.addEventListener('click', () => {
    const y = wallClock(new Date()).y, m = +button.dataset.month, d = +button.dataset.day;
    $('sun-on').checked = true;
    play(false);
    today = daySummary(y, m, d);
    when.y = y; when.m = m; when.d = d;
    ownHour = true;
    setWhen(y, m, d, sunniest());
  }));

  // When the sun is on the windows in summer and in winter, for the header.
  function summarizeSun() {
    const y = wallClock(new Date()).y;
    const five = (minutes) => hhmm(Math.round(minutes / 5) * 5);
    sunSpans = [[6, 21], [12, 21]].map((day) => {
      const spans = daySummary(y, day[0], day[1]).spans;
      return spans.length ? five(spans[0][0]) + '–' + five(spans[spans.length - 1][1]) : null;
    });
    retitle();
  }

  // --- labels and compass ---------------------------------------------------------------

  function buildLabels() {
    const layer = $('labels');
    const add = (html, at, note) => {
      const node = document.createElement('div');
      node.className = note ? 'label note' : 'label';
      layer.appendChild(node);
      labels.push({ node, html, at: new THREE.Vector3().fromArray(at), kind: 'name' });
    };
    info.rooms.forEach((room) => add(() => '<b>' + safe(room.name[lang]) + '</b><span>' +
                                           safe(local(room.area)) + '</span>', room.at, false));
    (info.notes || []).forEach((note) => add(() => safe(note.text[lang]), note.at, true));
  }

  // Inner lengths of the walls of every room, drawn on the floor; shown from above.
  function buildDims() {
    if (picture) return;
    dims = new THREE.Group();
    const points = [];
    const segment = (a, b) => points.push(new THREE.Vector3(a[0], 0.015, a[1]), new THREE.Vector3(b[0], 0.015, b[1]));
    const tick = 0.07, inset = 0.24;
    info.rooms.forEach((room) => {
      const b = room.box;
      const x0 = Math.min(b[0], b[2]), x1 = Math.max(b[0], b[2]), z0 = Math.min(b[1], b[3]), z1 = Math.max(b[1], b[3]);
      const z = z0 + inset, x = x0 + inset;
      segment([x0, z], [x1, z]);
      segment([x0, z - tick], [x0, z + tick]);
      segment([x1, z - tick], [x1, z + tick]);
      segment([x, z0], [x, z1]);
      segment([x - tick, z0], [x + tick, z0]);
      segment([x - tick, z1], [x + tick, z1]);
      // The sizes as the script wrote them ("2,75 × 5,14 m"): plan x first, then plan y.
      const sizes = room.size.replace(' m', '').split(' × ');
      const add = (text, at) => {
        const node = document.createElement('div');
        node.className = 'label dim';
        $('labels').appendChild(node);
        labels.push({ node, html: () => safe(local(text + ' m')), at, kind: 'dim' });
      };
      add(sizes[0], new THREE.Vector3((x0 + x1) / 2, 0.02, z));
      add(sizes[1], new THREE.Vector3(x, 0.02, (z0 + z1) / 2));
    });
    const lines = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(points),
      new THREE.LineBasicMaterial({ color: srgb(0x1f5f9c), depthTest: false, transparent: true, opacity: 0.85 }));
    lines.renderOrder = 5;
    lines.raycast = () => {};
    dims.add(lines);
    dims.visible = false;
    scene.add(dims);
  }

  // --- photos ---------------------------------------------------------------------------

  const CAMERA_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9 4 7.2 6H4a2 2 0 0 0-2 ' +
    '2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3.2L15 4H9zm3 4.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zm0 2a2.5 ' +
    '2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg>';

  function buildPins() {
    if (!photoDir || !info.photos || !info.photos.length) return;
    $('photos-switch').hidden = false;
    info.photos.forEach((photo, i) => {
      const node = document.createElement('button');
      node.type = 'button';
      node.className = 'pin';
      node.innerHTML = CAMERA_ICON;
      node.addEventListener('click', () => openPhoto(i));
      $('pins').appendChild(node);
      // Low over the floor where the photographer stood, below the room labels.
      pins.push({ node, photo, at: new THREE.Vector3(photo.eye[0], 0.25, photo.eye[2]) });
    });
  }

  // The photo on top of the model, which moves to where it was taken. From a pin the camera
  // flies there first and the photo fades in once it has landed and loaded; the arrows fade
  // one photo into the next while the camera moves behind them. Either way the previous
  // photo never shows under the new caption. Closing the photo flies back to where the
  // visitor was before the first one, so the next pin is in sight.
  function openPhoto(i) {
    const count = info.photos.length;
    photoShown = (i + count) % count;     // at once, so quick clicks on the arrows add up
    const photo = info.photos[photoShown];
    const ticket = ++photoAsked;
    const open = photoOpen();
    // Not while already on the way to a photo (the view is '' then): that is no place to
    // come back to. Mid-flight to a view, the place is where the flight lands.
    if (!open && state.view) {
      photoBack = {
        view: state.view, fitted: state.fitted,
        pose: state.animation ? state.animation.pose : {
          position: camera.position.clone(), target: controls.target.clone(), fov: camera.fov, mode: state.mode,
        },
      };
    }
    stopTour();
    if (tape.on) measure(false);
    const image = $('lightbox-image');
    const next = new Image();
    next.src = photoDir + photo.file;
    const waits = [next.decode().catch(() => {})];
    if (open) {
      image.classList.add('swapping');
      waits.push(new Promise((resolve) => setTimeout(resolve, 200)));   // the old photo fades out
    }
    // A flight cut short by another one never lands, and its photo is not shown. Already
    // standing there (the same photo opened again), there is nothing to fly and wait for.
    const pose = lookPose(photo.eye, photo.look);
    const there = camera.position.distanceTo(pose.position) < 0.01 && controls.target.distanceTo(pose.target) < 0.01;
    const landed = new Promise((resolve) => goTo(pose, '', there, resolve));
    if (!open) waits.push(landed);
    Promise.all(waits).then(() => {
      if (ticket !== photoAsked) return;
      image.src = next.src;
      captionPhoto();
      image.classList.remove('swapping');
      if (!open) showPhoto();
    });
  }

  function photoOpen() {
    return $('lightbox').classList.contains('shown');
  }

  function showPhoto() {
    const box = $('lightbox');
    clearTimeout(photoClosing);
    box.hidden = false;
    void box.offsetWidth;         // laid out transparent first, so the fade has a start
    box.classList.add('shown');
    $('lightbox-close').focus();
  }

  function captionPhoto() {
    if (photoShown < 0) return;
    const photo = info.photos[photoShown];
    $('lightbox-image').alt = photo.caption[lang];
    $('lightbox-caption').innerHTML = safe(photo.caption[lang]) + ' <span>' + (photoShown + 1) + ' / ' +
                                      info.photos.length + '</span>';
  }

  function closePhoto() {
    photoAsked++;
    photoShown = -1;
    $('lightbox').classList.remove('shown');
    photoClosing = setTimeout(() => { $('lightbox').hidden = true; }, 300);
    canvas.focus();
    const back = photoBack;
    photoBack = null;
    if (!back) return;
    // A view still fitted to the window is fitted again, in case the window changed (a
    // phone turned on its side); one the visitor had turned is restored as it was.
    if (back.fitted) show(back.view);
    else goTo(back.pose, back.view);
  }

  $('lightbox-close').addEventListener('click', closePhoto);
  $('lightbox-prev').addEventListener('click', () => openPhoto(photoShown - 1));
  $('lightbox-next').addEventListener('click', () => openPhoto(photoShown + 1));
  let swipe = null;
  $('lightbox').addEventListener('pointerdown', (event) => { swipe = { x: event.clientX, y: event.clientY }; });
  $('lightbox').addEventListener('pointerup', (event) => {
    if (!swipe) return;
    const dx = event.clientX - swipe.x, dy = event.clientY - swipe.y;
    swipe = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) openPhoto(photoShown + (dx < 0 ? 1 : -1));
    else if (Math.hypot(dx, dy) < 6 && event.target === $('lightbox')) closePhoto();   // a click beside the photo
  });

  // --- tape measure ---------------------------------------------------------------------

  function measure(on) {
    stopTour();
    spin(false);
    if (on && compact()) setOptions(false);
    tape.on = on;
    tape.points = [];
    $('measure').setAttribute('aria-pressed', String(on));
    canvas.classList.toggle('measuring', on);
    drawTape();
    tapeNotice();
  }

  function tapeNotice() {
    const key = tape.points.length === 1 ? 'measureNext' : tape.points.length === 2 ? 'measureAgain'
      : touch() ? 'measureStartTouch' : 'measureStart';
    notice(tape.on ? safe(t(key)) : '');
  }

  function drawTape() {
    if (tape.objects) {
      scene.remove(tape.objects);
      tape.objects.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
    }
    tape.objects = null;
    if (!tape.label) {
      const node = document.createElement('div');
      node.className = 'label measure';
      $('labels').appendChild(node);
      tape.label = { node, html: () => '', at: new THREE.Vector3(), kind: 'measure' };
      labels.push(tape.label);
    }
    tape.label.html = () => '';
    if (tape.points.length) {
      const colour = new THREE.MeshBasicMaterial({ color: srgb(0x1f5f9c), depthTest: false });
      tape.objects = new THREE.Group();
      tape.points.forEach((point) => {
        const dot = new THREE.Mesh(new THREE.SphereGeometry(0.035, 16, 8), colour);
        dot.position.copy(point);
        dot.renderOrder = 6;
        tape.objects.add(dot);
      });
      if (tape.points.length === 2) {
        const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(tape.points),
          new THREE.LineBasicMaterial({ color: srgb(0x1f5f9c), depthTest: false }));
        line.renderOrder = 6;
        tape.objects.add(line);
        const length = tape.points[0].distanceTo(tape.points[1]);
        tape.label.at.copy(tape.points[0]).add(tape.points[1]).multiplyScalar(0.5);
        tape.label.html = () => safe(metres(length));
      }
      tape.objects.traverse((o) => { o.raycast = () => {}; });
      scene.add(tape.objects);
    }
    tape.label.node.innerHTML = tape.label.html();
    invalidate();
  }

  $('measure').addEventListener('click', () => measure(!tape.on));

  // On a phone the options open as a sheet over the model; a touch on the model closes it.
  function setOptions(open) {
    $('app').classList.toggle('options-open', open);
    $('options-toggle').setAttribute('aria-expanded', String(open));
  }
  $('options-toggle').addEventListener('click', () => setOptions(!$('app').classList.contains('options-open')));
  canvas.addEventListener('pointerdown', () => { if (compact()) setOptions(false); });

  // ... and a tap on the title shows all the facts, which otherwise fit one line.
  document.querySelector('header.panel').addEventListener('click', (event) => {
    if (!compact() || event.target.closest('button, a')) return;
    document.querySelector('header.panel').classList.toggle('expanded');
  });
  $('tour').addEventListener('click', () => (tour.on ? stopTour() : startTour()));

  // --- sharing ---------------------------------------------------------------------------

  // A link to the published tour (also from the one-file page) that opens what is on the
  // screen now: the view and the furniture if it was changed. Not the language: whoever
  // opens the link gets their own browser's.
  function shareLink() {
    const options = [];
    if (state.view && state.view !== '3d') options.push('view=' + state.view);
    const arrangement = $('furniture').value;
    if (arrangement !== 'current') options.push('furniture=' + arrangement);
    return (info.share || location.href.split('#')[0]) + (options.length ? '#' + options.join('&') : '');
  }

  // A phone offers its own sheet (messengers, mail); elsewhere the link is copied.
  async function share() {
    if (!info) return;
    const url = shareLink();
    if (navigator.share && touch()) {
      const price = info.facts && info.facts[lang] ? info.facts[lang][0] : '';
      try {
        await navigator.share({ title: info.title[lang], text: info.title[lang] + (price ? ', ' + price : ''), url });
        return;
      } catch (error) {
        if (error && error.name === 'AbortError') return;    // closed without sharing
      }
    }
    try {
      await navigator.clipboard.writeText(url);
    } catch (error) {
      const field = document.createElement('textarea');
      field.value = url;
      field.setAttribute('readonly', '');
      field.style.position = 'fixed';
      field.style.opacity = '0';
      document.body.appendChild(field);
      field.select();
      document.execCommand('copy');
      field.remove();
    }
    const said = '<b>' + safe(t('copied')) + '</b>';
    notice(said);
    setTimeout(() => {
      if ($('notice').innerHTML !== said) return;
      if (tour.on) tourCaption();
      else if (tape.on) tapeNotice();
      else notice('');
    }, 2500);
  }
  $('share').addEventListener('click', share);

  // --- notice, tour and the slow turn at the start --------------------------------------

  function notice(html) {
    $('notice').innerHTML = html;
    $('notice').hidden = !html;
  }

  function spin(on) {
    controls.autoRotate = on;
    controls.autoRotateSpeed = 0.6;              // a full turn in about 100 s
    spinUntil = on ? performance.now() + 40000 : 0;
  }

  // The layout from above, then each room in the order of info.tour (as you would walk
  // in from the entrance), and back to the 3D view.
  function nextStop() {
    if (!tour.on) return;
    const stops = ['top'].concat(info.tour || info.rooms.map((room) => room.id));
    if (tour.step >= stops.length) {
      stopTour();
      show('3d');
      return;
    }
    tour.view = stops[tour.step++];
    show(tour.view);
    tourCaption();
    tour.timer = setTimeout(nextStop, tour.view === 'top' ? 3500 : 5200);
  }

  function tourCaption() {
    const room = info.rooms.find((r) => r.id === tour.view);
    notice(room
      ? '<b>' + safe(room.name[lang]) + '</b><span>' + safe(local(room.area)) + ' · ' + safe(local(room.size)) + '</span>'
      : '<b>' + safe(t('tourTop')) + '</b><span>' + safe(info.title[lang]) + '</span>');
  }

  function tourButtons() {
    ['tour', 'tour-nav'].forEach((id) => {
      if (!$(id)) return;
      $(id).setAttribute('aria-pressed', String(tour.on));
      $(id).textContent = t(tour.on ? 'tourStop' : 'tour');
    });
  }

  function startTour() {
    setOptions(false);
    if (tape.on) measure(false);
    spin(false);
    tour.on = true;
    tour.step = 0;
    tourButtons();
    nextStop();
  }

  function stopTour() {
    if (!tour.on) return;
    tour.on = false;
    clearTimeout(tour.timer);
    tourButtons();
    notice('');
  }

  // Inside a room on the tour the camera turns slowly, as if looking around.
  const turn = new THREE.Vector3();
  function turnHead(angle) {
    turn.copy(controls.target).sub(camera.position).applyAxisAngle(UP, angle);
    controls.target.copy(camera.position).add(turn);
    moved();
  }

  // Any touch, click, wheel or key of the visitor ends the turning and the tour.
  window.addEventListener('pointerdown', (event) => {
    if (controls.autoRotate) spin(false);
    if (tour.on && !(event.target.closest && event.target.closest('#tour, #tour-nav'))) stopTour();
  }, true);
  canvas.addEventListener('wheel', () => { spin(false); stopTour(); }, { passive: true });

  // Everything whose wording depends on the model: called once it is loaded and again
  // whenever the language changes.
  function retitle() {
    $('title').textContent = info.title[lang];
    $('subtitle').textContent = info.subtitle[lang];
    $('facts').innerHTML = (info.facts ? info.facts[lang] : []).map((fact) => '<span>' + safe(fact) + '</span>').join(' ');
    if (info.listing) {
      $('listing').href = info.listing;
      $('listing').hidden = false;
    }
    if (sunSpans) {
      $('sunline').textContent = t('sunline', sunSpans[0] || t('sunlineNever'), sunSpans[1] || t('sunlineNever'));
      $('sunline').hidden = false;
    }
    labels.forEach((label) => { label.node.innerHTML = label.html(); });
    pins.forEach((pin) => {
      const text = t('photo', pin.photo.caption[lang]);
      pin.node.title = text;
      pin.node.setAttribute('aria-label', text);
    });
    captionPhoto();
    tourButtons();
    if (tour.on) tourCaption();
    if (tape.on) tapeNotice();
    document.querySelectorAll('#views button[data-view]').forEach((button) => {
      const room = info.rooms.find((r) => r.id === button.dataset.view);
      button.textContent = room ? room.name[lang] : t(button.dataset.view === 'top' ? 'viewTop' : 'view3d');
    });
    $('sun-play').textContent = t(playing ? 'stop' : 'play');
    hint();
    applyOptions();
    dayDrawn = '';
    describeSun($('sun-on').checked);
  }

  const projected = new THREE.Vector3();
  const tip = new THREE.Vector3();

  function updateOverlays() {
    const width = canvas.clientWidth, height = canvas.clientHeight;
    const names = $('names').checked && state.mode === 'orbit';
    const shownKind = { name: names, dim: state.dims, measure: tape.on && tape.points.length === 2 };
    labels.forEach((label) => {
      projected.copy(label.at).project(camera);
      const on = shownKind[label.kind] && projected.z > -1 && projected.z < 1;
      label.node.style.display = on ? '' : 'none';
      if (!on) return;
      const x = (projected.x * 0.5 + 0.5) * width, y = (-projected.y * 0.5 + 0.5) * height;
      label.node.style.transform = 'translate(-50%, -50%) translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
    });
    // Not from above: there the dimensions have the floor.
    const pinsOn = !picture && $('photos').checked && state.mode === 'orbit' && !tape.on && !state.dims;
    pins.forEach((pin) => {
      projected.copy(pin.at).project(camera);
      const on = pinsOn && projected.z > -1 && projected.z < 1;
      pin.node.style.display = on ? '' : 'none';
      if (!on) return;
      const x = (projected.x * 0.5 + 0.5) * width, y = (-projected.y * 0.5 + 0.5) * height;
      pin.node.style.transform = 'translate(-50%, -50%) translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
    });

    // Which way north points on the screen right now.
    projected.copy(controls.target).project(camera);
    tip.set(info.north[0], 0, info.north[1]).multiplyScalar(0.5).add(controls.target).project(camera);
    const angle = Math.atan2((tip.x - projected.x) * width, (tip.y - projected.y) * height);
    $('needle').setAttribute('transform', 'rotate(' + THREE.MathUtils.radToDeg(angle).toFixed(1) + ')');
    $('north').setAttribute('x', (19 * Math.sin(angle)).toFixed(1));
    $('north').setAttribute('y', (-19 * Math.cos(angle)).toFixed(1));
    // ... and where the sun is, when it is up.
    const up = $('sun-on').checked && sunNow.el > 0;
    $('sun-dot').setAttribute('visibility', up ? 'visible' : 'hidden');
    if (up) {
      const bearing = angle + sunNow.az * RAD;
      $('sun-dot').setAttribute('cx', (15 * Math.sin(bearing)).toFixed(1));
      $('sun-dot').setAttribute('cy', (-15 * Math.cos(bearing)).toFixed(1));
    }
  }

  // --- camera ---------------------------------------------------------------------------

  // On a wide window the options take up the right-hand side, so the model is drawn
  // centred in what is left. Returns the width given up, in pixels.
  // On a phone the bars on top and at the bottom are measured instead, and the model is
  // drawn in the middle of the space between them. Returns the pixels given up.
  function clearOfPanel() {
    const width = canvas.clientWidth, height = canvas.clientHeight;
    const free = { side: 0, top: 0, bottom: 0 };
    if (state.mode === 'orbit' && compact()) {
      const box = canvas.getBoundingClientRect();
      const above = (node) => box.bottom - node.getBoundingClientRect().top;
      free.top = Math.max(0, document.querySelector('header.panel').getBoundingClientRect().bottom - box.top,
                          $('views').getBoundingClientRect().bottom - box.top);
      free.bottom = Math.max(0, above($('compass')), above($('options-toggle')));
    } else if (state.mode === 'orbit') {
      const options = $('options').offsetWidth;   // nothing when the controls are hidden
      free.side = width >= 900 && options ? options + 12 : 0;
    }
    if (free.side || free.top || free.bottom) {
      camera.setViewOffset(width, height, free.side / 2, (free.bottom - free.top) / 2, width, height);
    } else {
      camera.clearViewOffset();
    }
    return free;
  }

  // Distance from which the whole flat fits in the picture when looking from the given side.
  function fitDistance(target, azimuth, polar, fov) {
    const forward = new THREE.Vector3().setFromSphericalCoords(1, polar, azimuth).negate();
    const right = new THREE.Vector3().crossVectors(forward, UP).normalize();
    const up = new THREE.Vector3().crossVectors(right, forward);
    const narrow = canvas.clientWidth < 680;
    const free = clearOfPanel();
    // Leave room for the panels: more at the top and bottom, where they sit. A picture
    // has only the title and the compass in two corners, so the model can take more of it.
    // On a phone the bars have been measured: the model gets what is between them.
    const tan = Math.tan(THREE.MathUtils.degToRad(fov) / 2);
    const height = canvas.clientHeight;
    const tanV = compact() ? tan * Math.max(0.3, (height - free.top - free.bottom) / height) * 0.94
      : tan * (picture ? 0.86 : narrow ? 0.6 : 0.76);
    const tanH = tan * camera.aspect * (compact() ? 0.92 : (1 - free.side / canvas.clientWidth) * (narrow ? 0.84 : 0.9));
    const lo = info.bounds.min, hi = info.bounds.max;
    const corner = new THREE.Vector3();
    let distance = 1;
    const top = Math.max(1.2, cut.constant);
    for (let i = 0; i < 8; i++) {
      corner.set(i & 1 ? hi[0] : lo[0], i & 2 ? top : 0, i & 4 ? hi[2] : lo[2]).sub(target);
      const depth = corner.dot(forward);
      distance = Math.max(distance, Math.abs(corner.dot(right)) / tanH - depth, Math.abs(corner.dot(up)) / tanV - depth);
    }
    return distance;
  }

  function orbitPose(name, override) {
    const wide = canvas.clientWidth > canvas.clientHeight;
    let pose = name === 'top'
      ? { azimuth: wide ? -Math.PI / 2 : 0, polar: 0.001, fov: 20 }
      : { azimuth: wide ? -1.08 : -0.3, polar: 0.66, fov: 34 };
    if (override) pose = Object.assign(pose, override);
    const target = center.clone().setY(Math.min(info.height, parseFloat($('cut').value)) / 2);
    const distance = fitDistance(target, pose.azimuth, pose.polar, pose.fov);
    const position = new THREE.Vector3().setFromSphericalCoords(distance, pose.polar, pose.azimuth).add(target);
    return { position, target, fov: pose.fov, mode: 'orbit' };
  }

  function lookPose(eye, toward) {
    const position = new THREE.Vector3().fromArray(eye);
    const direction = new THREE.Vector3().fromArray(toward).sub(position).normalize();
    return { position, target: position.clone().addScaledVector(direction, 0.02), fov: eyeFov(), mode: 'look' };
  }

  function setMode(mode) {
    const look = mode === 'look';
    state.mode = mode;
    controls.enablePan = !look;
    controls.enableZoom = !look;
    controls.rotateSpeed = look ? -0.4 : 0.8;
    controls.minDistance = look ? 0.02 : 1.2;
    controls.maxDistance = look ? 0.02 : 70;
    controls.minPolarAngle = look ? 0.5 : 0;
    controls.maxPolarAngle = look ? Math.PI - 0.5 : Math.PI / 2 - 0.02;
    relight();
    clearOfPanel();
    applyOptions();
    hint();
  }

  function hint() {
    const touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    const kind = state.mode === 'look' ? 'look' : 'orbit';
    $('hint').textContent = t(kind + (touch ? 'Touch' : 'Mouse'));
    // A phone has no room for these instructions by the compass. It gets them as a notice
    // instead, once each: how to turn the model at the start and, the first time inside a
    // room, how to look around and walk. The notice goes at the next touch.
    if (picture || !compact() || tour.on || tape.on) return;
    if (!primer.seen[kind]) {
      primer.seen[kind] = true;
      primer.kind = kind;
    }
    if (primer.kind) {
      primer.text = safe(t(primer.kind + 'Touch'));      // again after a change of language
      notice(primer.text);
    }
  }
  window.addEventListener('pointerdown', () => {
    if (!primer.kind) return;
    if ($('notice').innerHTML === primer.text) notice('');
    primer.kind = '';
  }, true);

  // done, if given, is called when the camera lands; not if another flight replaces this one.
  function goTo(pose, view, instant, done) {
    state.view = view;
    document.querySelectorAll('#views button[data-view]').forEach((button) => {
      button.setAttribute('aria-pressed', String(button.dataset.view === view));
    });
    const still = instant || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    ownLens = false;
    // Leaving a room: lift the constraints first so the flight out is not clamped.
    if (pose.mode === 'orbit' && state.mode === 'look') setMode('orbit');
    controls.enabled = false;
    state.animation = {
      start: performance.now(), length: still ? 0 : 900, pose, done,
      position: camera.position.clone(), target: controls.target.clone(), fov: camera.fov,
    };
    invalidate();
  }

  function animate(now) {
    const a = state.animation;
    const t = a.length ? clamp((now - a.start) / a.length, 0, 1) : 1;
    const k = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    if (t === 1) {
      // The end is the pose itself: a blend can land a rounding error away from it, which
      // would make two pictures of the same view differ in a few pixels.
      camera.position.copy(a.pose.position);
      controls.target.copy(a.pose.target);
      camera.fov = a.pose.fov;
    } else {
      camera.position.lerpVectors(a.position, a.pose.position, k);
      controls.target.lerpVectors(a.target, a.pose.target, k);
      camera.fov = a.fov + (a.pose.fov - a.fov) * k;
    }
    camera.updateProjectionMatrix();
    camera.lookAt(controls.target);
    if (t === 1) {
      state.animation = null;
      setMode(a.pose.mode);
      controls.enabled = true;
      controls.update();
      if (a.done) a.done();
    }
    moved();
  }

  // --- interface ------------------------------------------------------------------------

  function show(view, instant, override) {
    const room = info.rooms.find((r) => r.id === view);
    state.fitted = !room;      // fitted to the window: done again when the window changes
    if (room) goTo(lookPose(room.eye, room.look), view, instant);
    else goTo(orbitPose(view === 'top' ? 'top' : '3d', override), view === 'top' ? 'top' : '3d', instant);
  }

  function buildButtons() {
    const nav = $('views');
    const add = (view) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.dataset.view = view;
      button.setAttribute('aria-pressed', 'false');
      button.addEventListener('click', () => show(view));
      nav.appendChild(button);
    };
    // On a phone the tour starts from the views bar; the header's button is hidden there.
    const guide = document.createElement('button');
    guide.type = 'button';
    guide.id = 'tour-nav';
    guide.setAttribute('aria-pressed', 'false');
    guide.addEventListener('click', () => (tour.on ? stopTour() : startTour()));
    nav.appendChild(guide);
    const gap = document.createElement('i');
    gap.className = 'tour-sep';
    nav.appendChild(gap);
    add('3d');
    add('top');
    nav.appendChild(document.createElement('i'));
    info.rooms.forEach((room) => add(room.id));
  }

  function applyOptions() {
    const height = state.mode === 'look' ? info.height : parseFloat($('cut').value);
    const chosen = parseFloat($('cut').value);
    cut.constant = height + 0.004;
    // Only a solid that the plane goes through has a cut to fill.
    caps.forEach((c) => { c.cap.visible = c.low < cut.constant && c.high > cut.constant; });
    $('cut-value').textContent = chosen >= info.height ? t('cutFull', metres(info.height)) : t('cutAt', metres(chosen));
    $('cut').disabled = state.mode === 'look';
    const arrangement = $('furniture').value;
    layers.current.forEach((group) => { group.visible = arrangement === 'current'; });
    layers.suggested.forEach((group) => { group.visible = arrangement === 'suggested'; });
    layers.fixtures.forEach((group) => { group.visible = arrangement !== 'none'; });
    $('idea-note').hidden = arrangement !== 'suggested';
    invalidate();
  }
  ['furniture', 'names', 'cut', 'photos'].forEach((id) => $(id).addEventListener('input', applyOptions));

  // Double click (or double tap) on a floor: stand there and look around.
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();

  function floorAt(clientX, clientY) {
    const box = canvas.getBoundingClientRect();
    pointer.set(((clientX - box.left) / box.width) * 2 - 1, -((clientY - box.top) / box.height) * 2 + 1);
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(pickable, false);
    for (let i = 0; i < hits.length; i++) {
      const hit = hits[i];
      if (!shown(hit.object) || hit.point.y > cut.constant) continue;
      return hit.object.userData.floor ? hit.point : null;
    }
    return null;
  }

  // Any surface in sight, for the tape measure.
  function surfaceAt(clientX, clientY) {
    const box = canvas.getBoundingClientRect();
    pointer.set(((clientX - box.left) / box.width) * 2 - 1, -((clientY - box.top) / box.height) * 2 + 1);
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(pickable, false);
    for (let i = 0; i < hits.length; i++) {
      if (shown(hits[i].object) && hits[i].point.y <= cut.constant) return hits[i].point.clone();
    }
    return null;
  }

  function walkTo(point) {
    const eye = info.rooms[0].eye[1];
    const position = new THREE.Vector3(point.x, eye, point.z);
    const direction = new THREE.Vector3();
    const room = info.rooms.find((r) => point.x > r.box[0] && point.x < r.box[2] && point.z > r.box[1] && point.z < r.box[3]);
    if (state.mode === 'look') {
      camera.getWorldDirection(direction);        // already inside: keep facing the same way
    } else if (room) {
      // Stepping in from outside: face the longest view across the room, not the nearest wall.
      const b = room.box, middle = new THREE.Vector3((b[0] + b[2]) / 2, eye, (b[1] + b[3]) / 2);
      const far = new THREE.Vector3(
        Math.abs(b[0] - point.x) > Math.abs(b[2] - point.x) ? b[0] : b[2], eye,
        Math.abs(b[1] - point.z) > Math.abs(b[3] - point.z) ? b[1] : b[3]);
      direction.copy(far).lerp(middle, 0.35).sub(position);
    } else {
      direction.copy(point).sub(camera.position);
    }
    direction.y = 0;
    if (direction.lengthSq() < 1e-6) direction.set(0, 0, -1);
    direction.normalize();
    goTo({ position, target: position.clone().addScaledVector(direction, 0.02), fov: eyeFov(), mode: 'look' }, '');
  }

  let down = null, lastTap = null;
  canvas.addEventListener('pointerdown', (event) => {
    down = { x: event.clientX, y: event.clientY, time: event.timeStamp };
  });
  canvas.addEventListener('pointerup', (event) => {
    if (!down || state.animation) return;
    const moved = Math.hypot(event.clientX - down.x, event.clientY - down.y);
    const tap = moved < 6 && event.timeStamp - down.time < 350;
    down = null;
    if (!tap) { lastTap = null; return; }
    if (tape.on) {
      const point = surfaceAt(event.clientX, event.clientY);
      if (!point) return;
      tape.points = tape.points.length === 1 ? [tape.points[0], point] : [point];
      drawTape();
      tapeNotice();
      return;
    }
    if (lastTap && event.timeStamp - lastTap.time < 400 &&
        Math.hypot(event.clientX - lastTap.x, event.clientY - lastTap.y) < 30) {
      lastTap = null;
      const point = floorAt(event.clientX, event.clientY);
      if (point) walkTo(point);
    } else {
      lastTap = { x: event.clientX, y: event.clientY, time: event.timeStamp };
    }
  });

  // Inside a room the wheel zooms the lens instead of moving the camera.
  canvas.addEventListener('wheel', (event) => {
    if (state.mode !== 'look' || state.animation) return;
    event.preventDefault();
    camera.fov = clamp(camera.fov + Math.sign(event.deltaY) * 3, EYE_NARROW, EYE_WIDE);
    ownLens = true;
    camera.updateProjectionMatrix();
    moved();
  }, { passive: false });

  // The keyboard. From outside the arrows turn and tilt the model, the way dragging in that
  // direction does; inside a room left and right turn the visitor and up and down walk
  // (W, S, A and D too: A and D step sideways). Plus and minus zoom in both. A key held
  // down is acted on once per frame, by the time the frame took: steady, and no faster
  // on a keyboard that repeats quickly.
  const held = new Set();
  const KEYS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', '+': 'in', '=': 'in', '-': 'out', _: 'out' };
  const CODES = { KeyW: 'up', KeyS: 'down', KeyA: 'stepLeft', KeyD: 'stepRight', NumpadAdd: 'in', NumpadSubtract: 'out' };

  function steering(event) {
    if (event.ctrlKey || event.metaKey || event.altKey) return '';
    const tag = event.target && event.target.tagName;      // a slider or a list has its own use for arrows
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return '';
    return KEYS[event.key] || CODES[event.code] || '';
  }

  const pressed = (more, less) => (held.has(more) ? 1 : 0) - (held.has(less) ? 1 : 0);
  const stepBy = new THREE.Vector3(), sideways = new THREE.Vector3(), from = new THREE.Vector3();
  const around = new THREE.Spherical();
  const feeler = new THREE.Raycaster();
  const DOWN = new THREE.Vector3(0, -1, 0);

  function steer(seconds) {
    const x = pressed('right', 'left'), y = pressed('up', 'down');
    const across = pressed('stepRight', 'stepLeft'), zoom = pressed('in', 'out');
    if (state.mode === 'look') {
      if (x) turnHead(-x * 1.3 * seconds);
      if (y || across) stride(y * 1.3 * seconds, across * seconds);
      if (zoom) {
        camera.fov = clamp(camera.fov - zoom * 40 * seconds, EYE_NARROW, EYE_WIDE);
        ownLens = true;
        camera.updateProjectionMatrix();
        moved();
      }
    } else if (x || across || y || zoom) {
      around.setFromVector3(stepBy.copy(camera.position).sub(controls.target));
      around.theta -= (x + across) * 1.4 * seconds;
      around.phi = clamp(around.phi + y * 0.9 * seconds, controls.minPolarAngle + 0.001, controls.maxPolarAngle);
      around.radius = clamp(around.radius * Math.exp(-zoom * 1.3 * seconds), controls.minDistance, controls.maxDistance);
      camera.position.setFromSpherical(around).add(controls.target);
      camera.lookAt(controls.target);
      state.fitted = false;                    // the visitor moved it, as with the mouse
      moved();
    }
  }

  // A step on the floor: ahead and to the right, in metres. Stopped by a wall, the
  // visitor slides along it: the walls run along the two axes, so the part of the step
  // along one of them is tried on its own.
  function stride(ahead, right) {
    stepBy.copy(controls.target).sub(camera.position).setY(0);
    if (stepBy.lengthSq() < 1e-12) return;     // looking straight up or down
    stepBy.normalize();
    sideways.set(-stepBy.z, 0, stepBy.x);
    stepBy.multiplyScalar(ahead).addScaledVector(sideways, right);
    const x = stepBy.x, z = stepBy.z;
    if (advance(x, z) || (Math.abs(x) > 1e-4 && advance(x, 0)) || (Math.abs(z) > 1e-4 && advance(0, z))) moved();
  }

  // Takes the step if nothing solid is in the way: at eye height ahead and to both sides
  // of ahead, which keeps a hand's breadth from walls met at a slant, and at the knees.
  // There must also be floor to stand on, which keeps the visitor off the furniture.
  const solid = (hit) => shown(hit.object);
  function advance(x, z) {
    const length = Math.hypot(x, z);
    if (!length) return false;
    const blocked = (height, angle) => {
      feeler.set(from.set(camera.position.x, height, camera.position.z), sideways.set(x / length, 0, z / length).applyAxisAngle(UP, angle));
      feeler.far = length + (angle ? 0.25 : 0.3);
      return feeler.intersectObjects(pickable, false).some(solid);
    };
    if (blocked(camera.position.y, 0) || blocked(camera.position.y, 0.6) || blocked(camera.position.y, -0.6) || blocked(0.4, 0)) return false;
    feeler.set(from.set(camera.position.x + x, camera.position.y, camera.position.z + z), DOWN);
    feeler.far = Infinity;
    const ground = feeler.intersectObjects(pickable, false).find(solid);
    if (!ground || !ground.object.userData.floor) return false;
    camera.position.x += x; camera.position.z += z;
    controls.target.x += x; controls.target.z += z;
    return true;
  }

  // A door opens for a visitor inside the flat who stands in front of it and looks its
  // way, or is in the room behind it and near, and shuts again when they have stepped
  // away. Not for one who merely passes: open, the bathroom door stands across the hall.
  const toDoor = new THREE.Vector3(), gaze = new THREE.Vector3();
  function swingDoors(step) {
    doors.forEach((door) => {
      let wanted = 0;
      if (state.mode === 'look' && !photoOpen()) {
        toDoor.copy(door.at).sub(camera.position).setY(0);
        const distance = toDoor.length();
        const beyond = -(toDoor.x * door.into[0] + toDoor.z * door.into[1]);    // how far past the doorway, into the room
        const aside = Math.abs(toDoor.x * door.into[1] - toDoor.z * door.into[0]);
        gaze.copy(controls.target).sub(camera.position).setY(0).normalize();
        const facing = distance > 0.01 ? (gaze.x * toDoor.x + gaze.z * toDoor.z) / distance : 1;
        // Wider limits once it is open, so that it does not flap at the edge of them.
        const k = door.wanted ? 1.3 : 1;
        if (beyond > 0) wanted = distance < 1.3 * k ? 1 : 0;
        else wanted = aside < 0.55 * k && -beyond < 1.25 * k && (door.wanted || facing > 0.7) ? 1 : 0;
        if (state.animation && !door.wanted) wanted = 0;       // not while flying past
      }
      door.wanted = wanted;
      if (door.open === wanted) return;
      door.open = clamp(door.open + (wanted ? 1 : -1) * step / 500, 0, 1);
      door.pivot.rotation.y = door.swing * door.open * door.open * (3 - 2 * door.open);
      door.pivot.updateMatrixWorld(true);
      invalidate();
    });
  }

  window.addEventListener('keyup', (event) => { held.delete(KEYS[event.key]); held.delete(CODES[event.code]); });
  window.addEventListener('blur', () => held.clear());

  window.addEventListener('keydown', (event) => {
    if (photoOpen()) {
      if (event.key === 'Escape') closePhoto();
      else if (event.key === 'ArrowLeft') openPhoto(photoShown - 1);
      else if (event.key === 'ArrowRight') openPhoto(photoShown + 1);
      return;
    }
    spin(false);
    const action = steering(event);
    if (action) {
      event.preventDefault();
      if (tour.on) stopTour();
      held.add(action);
      return;
    }
    if (event.key !== 'Escape') return;
    if (tour.on) stopTour();
    else if (tape.on) measure(false);
    else if (state.mode === 'look') show('3d');
  });

  function resize() {
    const width = canvas.clientWidth, height = canvas.clientHeight;
    if (!width || !height) return;
    renderer.setSize(width, height, false);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    clearOfPanel();
    invalidate();
    // A picture is taken by a program, which may give the window its final size only at
    // the moment of the screenshot and wait for nothing more (Chrome without a window does
    // exactly that), so the model is fitted to the new size and drawn here and now.
    if (picture && state.view) {
      show(state.view, true, asked);
      animate(performance.now());
      draw();
    } else if (state.fitted && state.mode === 'orbit' && !state.animation && state.view) {
      show(state.view, true, asked);   // a phone turned on its side, say
    } else if (state.mode === 'look' && !state.animation && !ownLens) {
      camera.fov = eyeFov();           // the same inside a room: the lens follows the window's shape
      camera.updateProjectionMatrix();
    }
  }

  function frame() {
    requestAnimationFrame(frame);
    // The same clock as goTo() and play() use; the frame's own time stamp can run on
    // another one (it does in Chrome without a window).
    const now = performance.now();
    const step = lastFrame ? Math.min(now - lastFrame, 100) : 0;
    lastFrame = now;
    if (controls.autoRotate && now > spinUntil) spin(false);
    // The controls turn by a fixed angle per frame, meant for 60 frames a second. Scaled by
    // the time the frame took, the turn is as fast on a 120 Hz screen as on a slow laptop.
    if (controls.autoRotate) controls.autoRotateSpeed = 0.6 * step * 0.06;
    if (tour.on && state.mode === 'look' && !state.animation) turnHead(step * 0.00011);
    if (held.size && !state.animation && !photoOpen()) steer(step / 1000);
    if (doors.length && !picture) swingDoors(step);
    if (state.animation) animate(now);
    else controls.update();
    if (playing) {
      // A whole day in about half a minute.
      const minutes = when.minutes + (now - playing) * 0.05;
      playing = now;
      if (minutes >= 1439) play(false);
      else setWhen(when.y, when.m, when.d, minutes);
    }
    if (state.dirty) draw();
    else if (!state.warmed && !picture && !state.animation && !controls.autoRotate && now - lastDraw > 1500) warmUp();
  }

  // With the lamps and without them the surfaces are drawn by different programs, and
  // making a set takes a moment (a second on an old laptop). The set not in use is made
  // here, in a quiet moment, so that the picture does not freeze the first evening or the
  // first step into a lit room. What is drawn for it is never shown: draw() follows at once.
  function warmUp() {
    state.warmed = true;
    lamps.forEach((light) => { light.visible = !light.visible; });
    renderer.render(scene, camera);
    lamps.forEach((light) => { light.visible = !light.visible; });
    draw();
  }

  function draw() {
    state.dirty = false;
    lastDraw = performance.now();
    if (disc.visible) disc.position.copy(camera.position).addScaledVector(toSun, 150);
    // The shadow under the flat only helps in slanted views; straight from above it is clutter.
    const tilt = tip.copy(camera.position).sub(controls.target).angleTo(UP);
    ground.material.opacity = 0.16 * clamp((tilt - 0.2) / 0.4, 0, 1);
    // Dimensions only from (nearly) straight above, where they read like a plan.
    state.dims = !!dims && $('names').checked && state.mode === 'orbit' && tilt < 0.35;
    if (dims) dims.visible = state.dims;
    if (state.shade) renderer.shadowMap.needsUpdate = true;
    state.shade = false;
    renderer.render(scene, camera);
    updateOverlays();
    document.documentElement.dataset.ready = '1';
  }

  // The middle of the longest span of sun on the windows that day; mid-morning if there is none.
  function sunniest() {
    const longest = today.spans.slice().sort((a, b) => (b[1] - b[0]) - (a[1] - a[0]))[0];
    return longest ? Math.round((longest[0] + longest[1]) / 10) * 5 : 600;
  }

  // The picture of the view outside came after the model was shown: what stands opposite
  // now shades the windows, so the day's sunny spans are worked out again.
  function surroundingsArrived() {
    today = daySummary(when.y, when.m, when.d);
    dayDrawn = '';
    setWhen(when.y, when.m, when.d, ownHour ? sunniest() : when.minutes);
  }

  // Optional settings in the address, e.g. #view=kitchen, #view=top&furniture=none&walls=1.2
  // (furniture=suggested for the proposed arrangement, labels=0 without the room labels)
  // or #date=2026-06-21&time=8:30 (sun=0 switches the real sun off), angle=30,60 for the
  // camera; #lang=en or #lang=uk for English or Ukrainian; #shot=1 for a picture without
  // the controls (header=0 also without the title). Links made before the names were
  // English still work: their Polish keys and room names are read as the English ones.
  const OLD_KEYS = {
    widok: 'view', meble: 'furniture', opisy: 'labels', sciany: 'walls', slonce: 'sun',
    data: 'date', godz: 'time', kat: 'angle', naglowek: 'header', zrzut: 'shot', jezyk: 'lang',
  };
  const OLD_VALUES = {
    view: { 'duzy-pokoj': 'large-room', 'maly-pokoj': 'small-room', kuchnia: 'kitchen', lazienka: 'bathroom', przedpokoj: 'hall' },
    furniture: { 0: 'none', puste: 'none', propozycja: 'suggested', obecne: 'current' },
  };

  function start() {
    const options = {};
    location.hash.replace(/^#/, '').split('&').forEach((pair) => {
      const parts = pair.split('=');
      if (!parts[0]) return;
      const key = decodeURIComponent(parts[0]), value = decodeURIComponent(parts[1] || '');
      const name = OLD_KEYS[key] || key;
      const renamed = OLD_VALUES[name];
      options[name] = renamed && Object.prototype.hasOwnProperty.call(renamed, value) ? renamed[value] : value;
    });
    if (picture && options.header === '0') document.documentElement.classList.add('bare');
    if (options.furniture === 'none' || options.furniture === 'suggested') $('furniture').value = options.furniture;
    if (options.labels === '0') $('names').checked = false;
    if (options.walls) $('cut').value = clamp(parseFloat(options.walls) || 1.25, 0.4, 2.5);
    if (options.sun === '0') $('sun-on').checked = false;
    if (compact()) $('sun').removeAttribute('open');

    // Start on today's date, at a time when the sun is on the windows if there is one.
    const now = wallClock(new Date());
    const date = /^\d{4}-\d{1,2}-\d{1,2}$/.test(options.date || '') ? options.date.split('-').map(Number) : [now.y, now.m, now.d];
    today = daySummary(date[0], date[1], date[2]);
    let minutes = sunniest();
    ownHour = true;
    if (/^\d{1,2}:\d{2}$/.test(options.time || '')) {
      minutes = parseInt(options.time, 10) * 60 + parseInt(options.time.split(':')[1], 10);
      ownHour = false;
    }
    when.y = date[0]; when.m = date[1]; when.d = date[2];
    setWhen(date[0], date[1], date[2], minutes);
    if (options.angle) {
      const angles = options.angle.split(',').map(parseFloat);
      asked = { azimuth: THREE.MathUtils.degToRad(angles[0] || 0), polar: THREE.MathUtils.degToRad(angles[1] || 45) };
    }
    resize();
    if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas);
    else window.addEventListener('resize', resize);
    setMode('orbit');
    show(options.view || '3d', true, asked);
    requestAnimationFrame(frame);
    // A slow turn draws the eye, unless the address asks for a particular view.
    const still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!picture && !still && !options.view && !options.angle) spin(true);
  }

  // The model as a file of its own (data-src). Its expected size only drives the progress
  // bar: a page kept from an earlier publish may meet a model of a different size.
  function download(url, size) {
    return fetch(url).then((response) => {
      if (!response.ok) throw new Error('HTTP ' + response.status);
      if (!response.body || !size) return response.arrayBuffer();
      const reader = response.body.getReader(), chunks = [];
      let got = 0;
      const more = () => reader.read().then((step) => {
        if (step.done) {
          const bytes = new Uint8Array(got);
          let at = 0;
          for (const chunk of chunks) { bytes.set(chunk, at); at += chunk.length; }
          return bytes.buffer;
        }
        chunks.push(step.value);
        got += step.value.length;
        $('loading-bar').value = Math.min(got / size, 1);
        return more();
      });
      return more();
    });
  }

  function failed(error) {
    console.error('The model could not be loaded:', error);
    fail(t('failModel'));
  }

  function parse(buffer) {
    new THREE.GLTFLoader().parse(buffer, '', (gltf) => setup(gltf.scene), failed);
  }

  try {
    const model = $('model');
    if (model.dataset.src) {
      download(model.dataset.src, parseInt(model.dataset.size, 10) || 0).then(parse).catch(failed);
    } else {
      parse(decode(model.textContent.trim()));
    }
  } catch (error) {
    failed(error);
  }
})();
</script>
</body>
</html>
